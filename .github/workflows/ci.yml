name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source:
    name: Source and secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan history with pinned Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --location --proto '=https' --tlsv1.2 --output "$archive" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --config .gitleaks.toml --log-opts=--all .
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.12.23'
          python-version: '3.11'
      - run: uv sync --locked
      - name: Create authored cross-platform project
        run: uv run python tests/storage/check_cross_platform_copy.py create portable-project.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: portable-source-project
          path: portable-project.zip
          retention-days: 3

  python:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    needs: source
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.12.23'
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - name: Record native platform and filesystem
        run: uv run python tests/storage/platform_metadata.py
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - name: Native regressions before expensive integration checks
        run: >-
          uv run pytest -vv -ra
          tests/storage/test_win32_read_buffer.py
          tests/api/test_path_admission.py
          tests/api/test_project_routes.py
          tests/api/test_api_m09_start_ack.py::test_http_group_start_acknowledges_before_held_execution_preparation_and_replays_receipt
          tests/api/test_m09_http_guards.py::test_http_results_evaluation_pin_and_report_download_are_protected
          tests/api/test_m09_supervisor.py::test_group_callback_survives_disconnect_and_resume_uses_callback_identity
          tests/providers/test_jev.py::test_a42_success_raw_response_and_usage_are_sanitized
          tests/cli/test_inventory.py::test_documented_cli_parameter_inventory_matches_typer_metadata
          tests/reports/test_cli_reports.py::test_installed_console_registers_report_commands_and_flags
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: portable-source-project
      - name: Verify copied bytes, replay and rebuilt index
        run: uv run python tests/storage/check_cross_platform_copy.py verify portable-project.zip
      - run: uv build
      - name: Clean locked wheel and sdist installs without Node
        run: uv run python tests/check_install.py
      - name: Full offline suite including storage and process death
        run: uv run pytest -vv -ra --durations=20 --junitxml=platform-results.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: platform-${{ matrix.os }}-${{ matrix.python }}
          path: platform-results.xml
          retention-days: 3

name: Offline foundation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.23'
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest -q
      - run: uv build
      - name: Install wheel and sdist in fresh environments
        run: uv run python tests/check_install.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect frontend sources
        id: sources
        run: test ! -f frontend/package.json || echo "present=true" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: steps.sources.outputs.present == 'true'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install tested npm
        if: steps.sources.outputs.present == 'true'
        run: npm install --global npm@11.19.1
      - name: Install frontend dependencies
        if: steps.sources.outputs.present == 'true'
        working-directory: frontend
        run: npm ci
      - name: Verify frontend
        if: steps.sources.outputs.present == 'true'
        working-directory: frontend
        run: |
          npm run build
          npm test
          npm run format:check
          npx playwright install --with-deps chromium
          npm run test:browser

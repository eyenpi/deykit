[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "deykit"
version = "0.1.0"
description = "Local typed decision debugging contracts and engine"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "pydantic>=2.12,<3",
    "jsonschema>=4.26,<5",
    "referencing>=0.37,<1",
    "typer>=0.20,<1",
    "httpx>=0.28.1,<0.29",
]

[project.scripts]
deykit = "deykit.cli.main:app"

[project.optional-dependencies]
keyring = [
    "keyring>=25,<26",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.14,<1", "mypy>=1.19,<2", "types-jsonschema>=4.25", "build>=1.3,<2"]

[tool.hatch.build.targets.wheel]
packages = ["src/deykit"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/architecture", "/guide", "/README.md", "/LICENSE", "/pyproject.toml", "/uv.lock", "/AGENTS.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

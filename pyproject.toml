[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "deykit"
version = "0.1.0"
description = "Local typed decision debugging contracts and engine"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "pydantic>=2.12,<3",
    "jsonschema>=4.26,<5",
    "referencing>=0.37,<1",
    "typer>=0.20,<1",
    "httpx>=0.28.1,<0.29",
    "fastapi==0.142.2",
    "starlette==1.7.0",
    "uvicorn==0.54.0",
]

[project.scripts]
deykit = "deykit.cli.main:app"

[project.optional-dependencies]
keyring = [
    "keyring>=25,<26",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.14,<1", "mypy>=1.19,<2", "types-jsonschema>=4.25", "build>=1.3,<2"]

[tool.hatch.build.targets.wheel]
packages = ["src/deykit"]
artifacts = [
    "src/deykit/api/static/**",
    "src/deykit/api/GENERATED-ASSETS.md",
    "src/deykit/api/THIRD-PARTY-NOTICES.md",
]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/architecture",
    "/guide",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
    "/uv.lock",
    "/AGENTS.md",
    "/frontend",
    "/scripts",
]
exclude = [
    "/frontend/node_modules",
    "/frontend/dist",
    "/frontend/.env",
    "/frontend/.env.*",
]

[tool.hatch.build.targets.sdist.force-include]
"frontend/tools/contracts/generate.mjs" = "frontend/tools/contracts/generate.mjs"
"frontend/tools/contracts/package.json" = "frontend/tools/contracts/package.json"
"frontend/tools/contracts/test/generate.test.mjs" = "frontend/tools/contracts/test/generate.test.mjs"
"frontend/tools/contracts/test/typecheck.cts" = "frontend/tools/contracts/test/typecheck.cts"
"frontend/tools/contracts/test/validator-bundle-entry.mjs" = "frontend/tools/contracts/test/validator-bundle-entry.mjs"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
